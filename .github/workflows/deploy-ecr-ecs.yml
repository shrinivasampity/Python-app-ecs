name: Deploy FastAPI to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load dev deployment config
        id: config
        run: |
          CONFIG_FILE=".github/deploy/dev.json"

          echo "aws_region=$(jq -r .aws_region $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "ecr_repository=$(jq -r .ecr_repository $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(jq -r .ecs_cluster $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(jq -r .ecs_service $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "ecs_task_family=$(jq -r .ecs_task_family $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "container_name=$(jq -r .container_name $CONFIG_FILE)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ steps.config.outputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.config.outputs.ecs_task_family }} \
            --query taskDefinition \
            > task-definition.json

      - name: Render new ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.config.outputs.container_name }}
          image: ${{ steps.build-image.outputs.image_uri }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.config.outputs.ecs_service }}
          cluster: ${{ steps.config.outputs.ecs_cluster }}
          wait-for-service-stability: true